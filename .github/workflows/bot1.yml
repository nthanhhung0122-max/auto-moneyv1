name: Auto TelePet 24/7 (Acc 2)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout ma nguon
        uses: actions/checkout@v4

      - name: Cai dat Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cai dat thu vien can thiet
        run: |
          python -m pip install --upgrade pip
          pip install requests telethon colorama

      - name: Chay Bot cay tien
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python auto_kiemtien1.py
